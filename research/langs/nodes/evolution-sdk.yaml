id: evolution-sdk
name: "Evolution SDK"
district: sdks
description: "Evolution SDK is a TypeScript-first, Effect-based Cardano SDK with its own pure-TypeScript ledger types (no WASM serialization library), pluggable Aiken or Scalus script evaluators and built-in providers. Hosted under the IntersectMBO GitHub organisation (transferred from no-witness-labs)."
maintainer: "IntersectMBO"
links:
  repo: https://github.com/IntersectMBO/evolution-sdk
  docs: https://intersectmbo.github.io/evolution-sdk/
