description: Proof-of-existence service (launched 2021) that anchors file fingerprints on Cardano as "Label 309" transaction metadata (CIP-0190), with optional encrypted copies on Arweave. Ships open-source SDKs in TypeScript, Python and Rust, a CLI, a self-hostable gateway and a GitHub Action.
