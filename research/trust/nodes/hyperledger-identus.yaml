id: hyperledger-identus
name: Hyperledger Identus (formerly Atala PRISM)
district: products
description: Self-sovereign identity framework (cloud agent, mediator, edge SDKs, PRISM node) for issuing and verifying W3C verifiable credentials, using Cardano as the verifiable data registry for did:prism identifiers. Originally IOG's Atala PRISM, contributed to Hyperledger / LF Decentralized Trust in 2023-2024.
maintainer: LF Decentralized Trust (contributors incl. Input Output)
links:
  website: https://identus.io/
  repo: https://github.com/hyperledger-identus
status: active
primarySector: identity
