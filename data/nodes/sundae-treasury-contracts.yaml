id: sundae-treasury-contracts
name: Sundae Treasury Contracts
district: products
description: Audited Aiken contracts (treasury + vendor) that hold ada withdrawn
  from the Cardano treasury and release it to vendors by milestone, with
  pause/resume/sweep permissions; ships a TypeScript SDK/CLI and the
  treasury.sundae.fi dashboard. Used by Intersect for 2025 treasury withdrawals
  and reused by PRAGMA for Amaru.
maintainer: Sundae Labs
links:
  website: https://treasury.sundae.fi/
  repo: https://github.com/SundaeSwap-finance/treasury-contracts
