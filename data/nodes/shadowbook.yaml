id: shadowbook
name: Shadowbook
district: products
description: Proprietary orderbook DEX on Cardano that keeps limit and market
  orders in an on-chain order book and settles matched trades through its own
  contract. It has no trading interface of its own and is offered as a
  liquidity venue through DexHunter.
