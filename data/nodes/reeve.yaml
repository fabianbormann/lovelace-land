onchain:
  metadataLabels:
    - 1447
  source: https://github.com/cardano-foundation/cf-reeve-platform/blob/main/docs/onChainFormat.md
  note: Reeve on-chain format uses label 1447 (also registered to Reeve in CIP-10;
    LOB_METADATA_LABEL default 1447). 1419 of 1429 label-1447 tx (2025-06-30 to
    2026-09-04) match the Reeve format. 10 tx from other apps (Mar-Aug 2026
    monthly asset reports and governance votes) also use 1447. All 141 Sept-2026
    tx are Reeve-format.
