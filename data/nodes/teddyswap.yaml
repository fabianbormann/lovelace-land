description: Stablecoin-focused AMM DEX on Cardano, built from forks of Spectrum
  Finance's Cardano DEX contracts, backend, SDK and interface. DefiLlama marks the
  protocol as rugged with a dead website, and teddyswap.org no longer serves the app
  (checked 2026-10-21).
