id: midnight
name: Midnight
district: bridges
description: Privacy-focused blockchain built as a Cardano partner chain; its
  node embeds IOG's Partner Chains toolkit and follows Cardano through db-sync.
  Its NIGHT token launched on Cardano as a native asset, distributed through the
  Glacier Drop and Scavenger Mine claim contracts on Cardano, and NIGHT held on
  Cardano generates DUST for fees on Midnight, whose network went live in March 2026.
maintainer: Midnight Foundation
links:
  website: https://midnight.network/
  repo: https://github.com/midnightntwrk/midnight-node
status: active
primarySector: null
