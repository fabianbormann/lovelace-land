id: tapdano
name: TapDano
district: products
description: Catalyst-funded (Fund 10) open-source project that combines NFC
  hardware (a JavaCard applet signing with Ed25519) with Cardano records for NFC
  wallets, physical product authentication and proof of attendance. Listed in
  the Identity category on cardano.org.
maintainer: TapDano
links:
  website: https://tapdano.com
  repo: https://github.com/tapdano
status: active
primarySector: identity
uses:
