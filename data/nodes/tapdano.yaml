    relation: language
    confidence: verified
    evidence:
      - url: https://github.com/tapdano/cardano-tapdano-validation/blob/main/aiken.toml
        kind: manifest
        retrieved: 2026-10-20
        note: "on-chain validation of ED25519 signatures from the TapDano JavaCard
