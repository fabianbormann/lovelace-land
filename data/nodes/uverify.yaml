id: uverify
name: UVerify
district: products
description: Open-source notary service that anchors file and text hashes on
  Cardano and renders each one as a shareable, verifiable certificate page
  (diplomas, product passports, lab reports, connected goods). Started inside
  the Cardano Foundation and listed in the Notary category on cardano.org.
maintainer: UVerify (Fabian Bormann)
links:
  website: https://uverify.io
  repo: https://github.com/UVerify-io
  docs: https://docs.uverify.io
status: active
primarySector: proof-verification
