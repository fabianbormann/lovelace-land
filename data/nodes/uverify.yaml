  note: "Proxy 07d07e14, State V1 499b5f20, Library 20c3394a (reference-script
    holder, never executed), and legacy V0 Auth Token a8172157, Issue State
    1919c122, Update State 314cdf9e and Connected Goods 2be4b4dc come from the
    StricaHQ contracts registry. They are cross-checked against uverify-backend:
    the V0 hashes are hardcoded for MAINNET in ValidatorUtils.java, and the
    proxy is parameterized with application.yml PROXY_TX_HASH e87045af...#1. A
    newer state-contract version (c054825a..., Aug 2026+) is deliberately not
    listed because no published source names it; every one of its transactions
    also runs the listed proxy, so counts are unaffected. It runs as a withdraw
    script only in tx that also run the proxy (1842/1842), as 499b5f20 does
    (11465/11465). Activity: V0 2025-04 to 2025-09, V1 2026-02-18 to 2026-09-30.
