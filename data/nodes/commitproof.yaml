  source: https://commitproof.com/_astro/cardano.B_cTHFFk.js
  note: The site's wallet flow calls attachMetadata({label:8413n}) with {hash,
    algo, version, app, ts}. All 33 label-8413 tx on chain (2026-03-01 to
    2026-09-20) carry app="commitproof.com". The card-payment path is
    server-side and its label is unconfirmed, but no other 8413 traffic exists.
