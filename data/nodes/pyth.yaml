id: pyth
name: Pyth Pro (Pyth Network)
district: oracles
description: Pull-based price oracle; Pyth Pro (Lazer) delivers signed
  low-latency price updates that a Cardano transaction carries and an on-chain
  Aiken library verifies. Announced live on Cardano in 2026 and described by the
  Cardano Developer Portal as the recommended production price oracle.
maintainer: Pyth Network
