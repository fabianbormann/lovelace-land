id: lenfi
name: Lenfi
district: products
description: Lending and borrowing protocol on Cardano, formerly Aada Finance
  (renamed Lenfi on 28 June 2023); its pooled V2 launched in February 2024 with
  contracts written in Aiken. DefiLlama TVL fell from about $78M (1 Dec 2024)
  to about $150k (21 Oct 2026), and DefiLlama and CardanoCube now flag its
  website as dead or archived.
maintainer: Lenfi (formerly Aada Finance)
