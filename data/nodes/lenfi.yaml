  note: "Every 56-hex hash with projectId lenfi in the Eternl script index
    (generated 2026-10-01): V1 P2P loan validators and NFT-bond policies, AADA
    staking/burn, V2 pool, pool-stake, repay and order (borrow/deposit/repay/
    withdraw) scripts. The same scripts are listed in the CRFA registry
    (dApps/AadaFinance.json and dApps_v2/AadaFinance.json, project name Lenfi).
    Status evidence: DefiLlama protocol API https://api.llama.fi/protocol/lenfi
    has deadUrl: true and an empty url (V2 Launch hallmark 2024-02-22);
    CardanoCube https://www.cardanocube.com/projects/lenfi says 'This project
    has been archived by Cardano Cube'; on 2026-10-21 lenfi.io redirected to an
    unrelated site. Rename date from https://coinmarketcap.com/assets/aada-finance
    ('On 28 June 2023, the project rebranded to Lenfi'). No dated official
    shutdown notice found."
