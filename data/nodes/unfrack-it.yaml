id: unfrack-it
name: Unfrack.it
district: wallets
description: Open-source web app from the DripDropz team that connects to a
  Cardano light wallet and consolidates or regroups its UTxOs and tokens into
  tidier bundles. Each transaction carries the CIP-20 message
  "https://unfrack.it", which the cardano.org leaderboard uses to count it
  (260 transactions, Sep 16 to Oct 16, 2026).
maintainer: DripDropz (Adam K. Dean)
