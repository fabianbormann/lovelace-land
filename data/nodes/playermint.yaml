id: playermint
name: PlayerMint
district: products
description: Play-to-earn layer for existing video games, starting with
  Fortnite, that pays players in its PMX token at the end of each Cardano epoch
  based on their in-game performance; PMX can be spent in its NFT marketplace.
  It launched on Cardano mainnet in 2023, and MLabs' Cardano Transaction Lib
  lists it as a production user.
