id: wanchain-bridge
name: Wanchain Bridge (Cardano)
district: bridges
description: Decentralized cross-chain bridge whose MPC "Storeman" nodes connect
  Cardano mainnet (since August 2023) to Bitcoin, Ethereum, EVM chains and
  others, bringing assets such as USDT/USDC to Cardano. Its Cardano-to-BNB Chain
  route was exploited on 2026-07-20 via a non-injective signed-message encoding
  in the TreasuryCheck validator (about 515M NIGHT drained).
maintainer: Wanchain
