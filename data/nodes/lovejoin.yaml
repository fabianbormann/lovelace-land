description: Non-custodial privacy mixer for ADA by Logical Mechanism. Users
  deposit a fixed amount into a shared pool that anyone can re-randomise, then
  withdraw to a fresh address with a Schnorr proof; the unaudited contracts
  were bootstrapped on mainnet on 26 September 2026.
