id: orcfax
name: Orcfax
district: oracles
description: Decentralized oracle that publishes signed "fact statements" (e.g.
  currency exchange rates and Cardano native token prices) on Cardano for smart
  contracts to read as reference inputs, with a public explorer for each
  published fact.
maintainer: Orcfax
links:
  website: https://orcfax.io
  repo: https://github.com/orcfax/publish
  docs: https://docs.orcfax.io
status: active
primarySector: null
uses:
  - target: aiken
    relation: language
    confidence: verified
    evidence:
      - url: https://github.com/orcfax/publish/blob/main/aik/aiken.toml
        kind: manifest
        retrieved: 2026-10-20
        note: The publish dApp's validators are an Aiken project (orcfax/orcfax-pub)
          with plutus.json
  - target: lucid
    relation: library
    confidence: verified
    evidence:
      - url: https://github.com/orcfax/publish/blob/main/kio/deps.ts
        kind: manifest
        retrieved: 2026-10-20
        note: Deno deps pin spacebudz/lucid (and its bundled cardano-multiplatform-lib)
          at a fixed commit
  - target: kupo
    relation: infrastructure
    confidence: verified
    evidence:
      - url: https://github.com/orcfax/publish/blob/main/cli/README.md
        kind: docs
        retrieved: 2026-10-20
        note: Publisher CLI uses a "kupmios" provider (Kupo + Ogmios); Blockfrost is
          listed as alternative
  - target: ogmios
    relation: infrastructure
    confidence: verified
    evidence:
      - url: https://github.com/orcfax/publish/blob/main/cli/README.md
        kind: docs
        retrieved: 2026-10-20
        note: '--provider kupmios --provider-opts "{{KUPO_URL}} {{OGMIOS_HOST}}
          {{OGMIOS_PORT}}"'
