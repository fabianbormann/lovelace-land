id: ledger-live
name: Ledger Live
district: wallets
description: Ledger's companion app for its hardware wallets. Its Cardano support
  (send, receive and native tokens since June 2022, staking since August 2023)
  builds and signs transactions with Strica's typhonjs, bip32ed25519 and cbors
  libraries.
maintainer: Ledger
