id: saturn-nft
name: SaturnNFT
district: products
description: No-code platform to create, mint and upgrade Cardano NFTs, with an
  image generator, payment gateway and a CIP-68 upgrade (levelling) system for
  dynamic NFTs, launched in 2022. Its website saturnnft.io no longer serves the
  platform (it redirects to an unrelated site as of 2026-10-21; last archived
  live in February 2026), but cardano.org reports 343 on-chain transactions of
  its upgrade contract in the 30 days to 2026-10-16.
maintainer: Saturn
