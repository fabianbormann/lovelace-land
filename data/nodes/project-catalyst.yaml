id: project-catalyst
name: Project Catalyst (Catalyst Voices)
district: products
description: Cardano's community innovation fund where ada holders register and vote on funding proposals; Catalyst Voices is the open-source app and Catalyst Gateway backend. Stewardship moved from IOG to the Cardano Foundation in 2026, and Funds 15 and 16 will not run in their proposed form while the process is redesigned.
maintainer: Cardano Foundation (formerly Input Output)
links:
  website: https://projectcatalyst.io
  repo: https://github.com/cardano-foundation/catalyst-voices
status: maintenance
primarySector: governance
uses:
  - target: pallas
    relation: library
    confidence: verified
    evidence:
      - url: https://github.com/cardano-foundation/catalyst-voices/blob/main/catalyst-gateway/bin/Cargo.toml
        kind: manifest
        retrieved: 2026-10-20
        note: Catalyst Gateway depends on cardano-chain-follower from catalyst-libs.
      - url: https://github.com/cardano-foundation/catalyst-libs/blob/main/rust/cardano-blockchain-types/Cargo.toml
        kind: manifest
        retrieved: 2026-10-20
        note: pallas-traverse/-network/-primitives etc. pinned to IOG's catalyst-pallas fork (transitive via catalyst-libs).
  - target: mithril
    relation: infrastructure
    confidence: verified
    evidence:
      - url: https://github.com/cardano-foundation/catalyst-libs/blob/main/rust/cardano-chain-follower/Cargo.toml
        kind: manifest
        retrieved: 2026-10-20
        note: cardano-chain-follower depends on mithril-client (used to bootstrap chain data).
lastVerified: 2026-10-20
