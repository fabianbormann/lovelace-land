id: d-abis
name: d'ABIS (Decentralized Automated Ballistic Identification System)
district: products
description: Cardano Foundation proof of concept that matches ballistic evidence scans (x3p files) and anchors records to Cardano through the Foundation's "metabus" transaction pipeline, so forensic data can be shared between agencies. Listed in the Foundation's 2024 Activity Report. It was shown as a demonstrator at the World Police Summit in Dubai in March 2024; development stopped around August 2024 and the Cardano Foundation no longer maintains it. Its source repository is no longer public (404 on 2026-10-20), so its dependency roads are marked reported rather than verified.
maintainer: Cardano Foundation
status: deprecated
primarySector: proof-verification
