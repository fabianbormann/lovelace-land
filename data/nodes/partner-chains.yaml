id: partner-chains
name: Partner Chains Toolkit
district: bridges
description: IOG's Substrate-based toolkit for building "partner chains" whose
  block-producer committees mix registered Cardano SPOs and permissioned
  validators, follow Cardano state via db-sync, and use Cardano-side smart
  contracts (including a native token reserve). The repository is now archived;
  the README says development continues in the Midnight node.
maintainer: Input Output Global (IOG)
links:
