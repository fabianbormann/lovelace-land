id: spacebudz
name: SpaceBudz
district: products
description: One of Cardano's first NFT collections (10,000 astronauts), which
  opened the first smart-contract-based NFT marketplace on Cardano in October
  2021 and moved to a new CIP-68 policy through its Wormhole contract in 2023.
  Its creator ended support in February 2026 and handed it over in March 2026;
  the new maintainer still patches the legacy cancel and migration flows, and
  cardano.org reports 740 on-chain transactions in the 30 days to 2026-10-16.
maintainer: Rightstuff Innovations
