id: blockforce
name: Blockforce
district: products
description: Brazilian traceability company that keeps supply-chain records
  private on a Hyperledger Fabric network and anchors batched cryptographic
  proofs of them on Cardano with uVerify, so auditors can check a record without
  seeing the business data. Announced with the Cardano Foundation on 31 August
  2026 with more than 500,000 records anchored and signed contracts for 6.5
  million certified records through 2030.
