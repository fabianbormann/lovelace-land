id: indigo
name: Indigo Protocol
district: products
description: Synthetic-asset (CDP) protocol on Cardano; users lock ADA to mint
  iAssets such as iUSD, iBTC, iETH and iSOL.
maintainer: Indigo Labs / Indigo Foundation
