id: genius-yield
name: Genius Yield
district: products
description: Order-book DEX on Cardano with staking and smart liquidity vaults, built
  by the team behind the Atlas framework. A CryptoNewz post on 24 September 2026
  reported that Genius Yield is winding down and leaving its code open source; its
  open-source Genius Zero client trades against the contracts without the company
  website.
maintainer: Genius Yield
