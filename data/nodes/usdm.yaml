    relation: library
    confidence: verified
    evidence:
      - url: https://www.youtube.com/watch?v=Kk11hXjsFgw&t=220s
        kind: talk
        retrieved: 2026-10-23
        note: '"Cardano: NerdOut - Bloxbean" (Andrew Westberg''s channel): at about 3:40 Andrew says the USDM team uses the Java Cardano Client Lib day to day'
