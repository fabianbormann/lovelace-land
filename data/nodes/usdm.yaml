id: usdm
name: USDM (Moneta)
district: products
description: Fiat-backed USD stablecoin native to Cardano, launched March 2024
  (originally by Mehen); issued by Moneta Digital in the US and co-issued by NBX
  in the EEA, with reserves attested on-chain by an oracle.
maintainer: Moneta Digital
links:
  website: https://moneta.global
  docs: https://moneta.global/developers/
status: active
primarySector: payments
