id: seedelf
name: Seedelf
district: products
description: Stealth wallet by Logical Mechanism that hides the receiver and
  spender of funds inside a Plutus V3 contract, using a Schnorr-style proof
  over the BLS12-381 curve. It ships as a command-line wallet and a Chrome
  wallet extension.
maintainer: Logical Mechanism
links:
  repo: https://github.com/logical-mechanism/Seedelf-Wallet
packages:
  - ecosystem: cargo
    name: seedelf-cli
status: active
primarySector: payments
uses:
  - target: aiken
    relation: language
    confidence: verified
    evidence:
      - url: https://github.com/logical-mechanism/Seedelf-Wallet/blob/main/seedelf-contracts/aiken.toml
        kind: manifest
        retrieved: 2026-10-21
        note: 'compiler = "v1.1.24", plutus = "v3", depends on aiken-lang/stdlib v4.0.0'
  - target: pallas
    relation: library
    confidence: verified
    evidence:
      - url: https://github.com/logical-mechanism/Seedelf-Wallet/blob/main/seedelf-platform/seedelf-core/Cargo.toml
        kind: manifest
        retrieved: 2026-10-21
        note: 'pallas-addresses, pallas-primitives, pallas-txbuilder, pallas-wallet = "0.35.0"'
  - target: koios
    relation: service
    confidence: verified
    evidence:
      - url: https://github.com/logical-mechanism/Seedelf-Wallet/blob/main/seedelf-platform/seedelf-koios/Cargo.toml
        kind: manifest
        retrieved: 2026-10-21
        note: 'crate seedelf-koios: "Koios Packages For Seedelf"; used by seedelf-core and seedelf-cli'
  - target: cardano-db-sync
    relation: infrastructure
    confidence: verified
    evidence:
