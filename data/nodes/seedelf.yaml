        kind: docs
        retrieved: 2026-10-21
        note: '"Seedelf Wallet''s data layer: the API in front of the home db-sync, Kupo and node. Mainnet only."'
  - target: kupo
    relation: infrastructure
    confidence: verified
    evidence:
      - url: https://github.com/logical-mechanism/Seedelf-Wallet/blob/main/seedelf-data/README.md
        kind: docs
        retrieved: 2026-10-21
        note: 'index "read from db-sync, or from the Seedelf-only Kupo when db-sync is down or behind"'
  - target: ogmios
    relation: infrastructure
    confidence: verified
    evidence:
      - url: https://github.com/logical-mechanism/Seedelf-Wallet/blob/main/seedelf-data/README.md
        kind: docs
        retrieved: 2026-10-21
        note: '"Koios''s /api/v1/submittx and /api/v1/ogmios paths, passed to the home cardano-submit-api and Ogmios"'
