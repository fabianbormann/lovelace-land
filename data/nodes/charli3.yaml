id: charli3
name: Charli3
district: oracles
description: Decentralized oracle network for Cardano offering push-based price
  feeds and an on-demand (pull) "ODV" multisig oracle whose node operators
  aggregate and sign price data that is verified on-chain. Also runs a Substrate
  partner-chain variant for oracle aggregation.
maintainer: Charli3
links:
  website: https://charli3.io
  repo: https://github.com/Charli3-Official/charli3-pull-oracle-contracts
  docs: https://docs.charli3.io
status: active
primarySector: null
