id: cardano-ballot
name: Cardano Ballot
district: products
description: Hybrid on-chain/off-chain voting system from the Cardano
  Foundation, used for community polls such as the Cardano Summit Awards. Votes
  are signed with CIP-30 wallets, committed on-chain via Merkle roots, and a
  Hydra-based tally app was used for the 2023 awards.
maintainer: Cardano Foundation
links:
  repo: https://github.com/cardano-foundation/cf-cardano-ballot
status: active
primarySector: governance
