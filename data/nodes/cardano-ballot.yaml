  note: "Vote-commitment (Merkle root) metadata label:
    l1.transaction.metadata.label=${VOTING_METADATA_LABEL:11113}, also Helm
    default 11113. On-chain bodies confirmed (e.g. type COMMITMENTS,
    CARDANO_SUMMIT_AWARDS_2025). Activity is event-driven (Sep-Dec 2023, Sep-Oct
    2024, Jun-Jul 2025, Sep-Oct 2025); none since Nov 2025, so 0 in Sept 2026."
