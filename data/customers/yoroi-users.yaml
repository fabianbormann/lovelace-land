id: yoroi-users
name: Yoroi (SecondFi) users
type: segment
sectors: [ payments, defi ]
stage: ended
description: People using EMURGO's Yoroi light wallet, rebranded SecondFi in
  April 2026, to hold, send, stake and swap ada. After a wallet-draining exploit
  in June 2026 EMURGO announced in July 2026 that SecondFi and the Yoroi wallet
  would cease operations; the app runs in a recovery-only mode.
