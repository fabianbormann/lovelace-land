id: ethiopia-ministry-of-education
name: Ethiopia Ministry of Education
type: government
sectors: [ identity ]
stage: pilot
description: Signed with IOHK in April 2021 to give about 5 million students and
  750,000 teachers in 3,500 schools tamper-proof digital IDs and attainment
  records via Atala PRISM. In March 2023 Charles Hoskinson said the system was
  live and expected to reach one million students by end of 2023; no later
  independent status update was found.
