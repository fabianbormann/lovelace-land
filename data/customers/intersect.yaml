id: intersect
name: Intersect
type: organization
sectors: [governance]
stage: production
description: Member-based organisation that facilitates Cardano's budget process and elections. It runs DRep budget votes and Constitutional Committee elections on the Ekklesia-powered Hydra Voting Platform, administers treasury withdrawals through Sundae Labs' milestone contracts, and used a Clarity-built app for the Constitutional Convention vote.
uses:
  - target: ekklesia
    confidence: verified
    evidence:
      - url: https://docs.hydra-voting.intersectmbo.org/budget-process/budget-proposals-drep-voting
        kind: docs
        retrieved: 2026-10-20
        note: '"conducted through the Intersect Hydra Voting Platform, powered by Ekklesia."'
      - url: https://intersectmbo.org/news/intersect-development-update-65-june-6
        kind: announcement
        retrieved: 2026-10-20
        note: The 39 proposals in the 2025 Budget Info Action were "reviewed through Ekklesia".
  - target: sundae-treasury-contracts
    confidence: verified
    evidence:
      - url: https://intersectmbo.org/news/vote-now-39-cardano-treasury-proposals-await-drep-and-cc-approval
        kind: announcement
        retrieved: 2026-10-20
        note: Withdrawals facilitated by "a smart contract framework developed together with Sundae Labs".
  - target: clarity
    confidence: verified
    evidence:
      - url: https://www.clarity.community/
        kind: case-study
        retrieved: 2026-10-20
        note: Intersect testimonial that the Clarity team delivered a voting app for the Cardano Constitutional Convention that ran reliably during a live vote.
lastVerified: 2026-10-20
