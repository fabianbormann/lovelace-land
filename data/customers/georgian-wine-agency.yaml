    confidence: verified
    evidence:
      - url: https://cardanofoundation.org/blog/introducing-originate
        kind: announcement
        retrieved: 2026-10-20
        note: "In a significant collaboration with Scantrust and the National Wine
          Agency of Georgia, alongside over 30 wineries in the Bolnisi region,
          we implemented Originate"
