id: georgian-wine-agency
name: National Wine Agency of Georgia
type: government
sectors: [ supply-chain, proof-verification ]
stage: production
description: Georgia's public wine authority stores its certificates of
  conformity and certification steps for Bolnisi-region wine on Cardano so each
  bottle's supply chain can be traced via a QR code, in a programme run with the
  Cardano Foundation, the Bolnisi Winemakers Association and Scantrust.
